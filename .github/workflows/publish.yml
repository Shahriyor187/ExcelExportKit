name: Publish to NuGet.org

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet version to publish (must match .csproj Version)"
        required: true
        default: "2.0.0"
      confirmation:
        description: "Type PUBLISH to confirm the irreversible NuGet publication"
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate explicit publishing approval
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$RELEASE_CONFIRMATION" != "PUBLISH" ]; then
            echo "Publishing requires typing PUBLISH into the confirmation field."
            exit 1
          fi

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          version=os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",version):
              raise SystemExit("Release version must be X.Y.Z")
          root=ET.parse("ExcelExportKit.csproj").getroot()
          configured=root.findtext("./PropertyGroup/Version")
          if configured!=version:
              raise SystemExit(f"Version mismatch: workflow={version}, project={configured}")
          print("Release version verified:",version)
          PY

      - name: Restore and run tests
        run: |
          dotnet restore tests/ExcelExportKit.Tests/ExcelExportKit.Tests.csproj
          dotnet test tests/ExcelExportKit.Tests/ExcelExportKit.Tests.csproj -c Release --no-restore

      - name: Audit NuGet packages
        run: |
          dotnet list ExcelExportKit.csproj package --vulnerable --include-transitive \
            --format json --output-version 1 --no-restore > nuget-audit.json
          python3 .github/scripts/check-nuget-audit.py nuget-audit.json

      - name: Pack
        run: dotnet pack ExcelExportKit.csproj -c Release --output ./artifacts

      - name: Smoke-test packed candidate on .NET 8 and .NET 10
        run: bash .github/scripts/test-local-package.sh

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          files=list(Path("artifacts").glob("*.nupkg"))
          assert len(files)==1, f"Expected exactly one NuGet package: {files}"
          with zipfile.ZipFile(files[0]) as archive:
              names=set(archive.namelist())
              required={"README.md","LICENSE.txt","lib/net8.0/ExcelExportKit.dll","lib/net10.0/ExcelExportKit.dll"}
              assert required <= names, f"Missing files: {required - names}"
          print("Validated package:",files[0])
          PY

      - name: Exchange GitHub OIDC token for short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: Shahriyor

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
