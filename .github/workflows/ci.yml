name: CI

on:
  push:
    branches: [master, "chore/**"]
  pull_request:
    branches: [master, "feat/v21-progress"]

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore tests/ExcelExportKit.Tests/ExcelExportKit.Tests.csproj

      - name: Audit direct and transitive NuGet dependencies
        run: |
          dotnet list ExcelExportKit.csproj package --vulnerable --include-transitive \
            --format json --output-version 1 --no-restore > nuget-audit.json
          dotnet list ExcelExportKit.csproj package --include-transitive \
            --format json --output-version 1 --no-restore > nuget-inventory.json
          python3 .github/scripts/check-nuget-audit.py nuget-audit.json nuget-inventory.json

      - name: Test on .NET 8 and .NET 10
        run: dotnet test tests/ExcelExportKit.Tests/ExcelExportKit.Tests.csproj --configuration Release --no-restore

      - name: Compile local real-workbook probe
        run: dotnet build tests/ExcelExportKit.ReleaseProbe/ExcelExportKit.ReleaseProbe.csproj --configuration Release

      - name: Check local probe CLI
        run: dotnet run --project tests/ExcelExportKit.ReleaseProbe/ExcelExportKit.ReleaseProbe.csproj -c Release --no-build -- --help

      - name: Build benchmark harness
        run: dotnet build tests/ExcelExportKit.Benchmarks/ExcelExportKit.Benchmarks.csproj --configuration Release

      - name: Smoke-test benchmark isolation (1K rows)
        run: |
          python3 tests/ExcelExportKit.Benchmarks/run_benchmarks.py \
            --dll tests/ExcelExportKit.Benchmarks/bin/Release/net10.0/ExcelExportKit.Benchmarks.dll \
            --rows 1000 --output "${{ runner.temp }}/benchmark-smoke" --repeats 1

      - name: Compare progress reporting overhead
        run: dotnet run --project tests/ExcelExportKit.Benchmarks/ExcelExportKit.Benchmarks.csproj -c Release -- --progress

      - name: Pack both target frameworks
        run: dotnet pack ExcelExportKit.csproj --configuration Release --no-restore --output ./artifacts

      - name: Read candidate package version
        run: |
          echo "PACKAGE_VERSION=$(dotnet msbuild ExcelExportKit.csproj -getProperty:Version -nologo | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: Verify NuGet package contents
        env:
          PACKAGE_ID: ExcelExportKit
          LICENSE_FILE: LICENSE.txt
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          import zipfile

          package_id = os.environ["PACKAGE_ID"]
          license_file = os.environ["LICENSE_FILE"]
          packages = glob.glob("artifacts/*.nupkg")
          assert len(packages) == 1, f"Expected exactly one .nupkg: {packages}"
          assert os.path.basename(packages[0]) == f"{package_id}.{os.environ['PACKAGE_VERSION']}.nupkg", "Wrong candidate package version"
          with zipfile.ZipFile(packages[0]) as archive:
              names = archive.namelist()
              required = {
                  "README.md",
                  license_file,
                  "lib/net8.0/" + package_id + ".dll",
                  "lib/net10.0/" + package_id + ".dll",
              }
              missing = required.difference(names)
              assert not missing, f"Missing package entries: {sorted(missing)}"
              nuspecs = [name for name in names if name.endswith(".nuspec")]
              assert len(nuspecs) == 1, f"Expected one nuspec, got {nuspecs}"
              root = ET.fromstring(archive.read(nuspecs[0]))
              metadata = next(child for child in root if child.tag.endswith("metadata"))
              readme = next(
                  (child.text for child in metadata if child.tag.endswith("readme")),
                  None,
              )
              assert readme == "README.md", f"Unexpected README metadata: {readme}"
              print(f"Verified {packages[0]}: README, license, both target frameworks")
          PY

      - name: Install and execute packed candidate on .NET 8 and .NET 10
        run: bash .github/scripts/test-local-package.sh

      - name: Upload NuGet build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExcelExportKit-nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
