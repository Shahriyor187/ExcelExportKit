name: Excel conversion benchmarks

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Fixture rows"
        required: true
        type: choice
        options:
          - "1000"
          - "10000"
          - "100000"
        default: "1000"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build benchmark worker
        run: dotnet build tests/ExcelExportKit.Benchmarks/ExcelExportKit.Benchmarks.csproj -c Release

      - name: Measure isolated, warmed-up conversions
        run: |
          python3 tests/ExcelExportKit.Benchmarks/run_benchmarks.py \
            --dll tests/ExcelExportKit.Benchmarks/bin/Release/net10.0/ExcelExportKit.Benchmarks.dll \
            --rows "${{ inputs.rows }}" \
            --output "${{ runner.temp }}/benchmark-results" --repeats 3

      - name: Add benchmark summary
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"benchmark-results"/"benchmark.json").read_text())
          summary=[f"## ExcelExportKit benchmark ({data['rows']:,} rows)", "",
                   "Fresh process per trial, one warmup then one measurement; median of 3 trials.",
                   "", "| Operation | Median time (ms) | Median peak RSS (MiB) |",
                   "|---|---:|---:|"]
          for kind, item in data["results"].items():
              summary.append(f"| {kind} | {item['medianElapsedMs']:.1f} | {item['medianPeakWorkingSetBytes']/1048576:.1f} |")
          summary.append("")
          summary.append("Peak RSS includes worker warmup, excludes workbook generation.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(summary)+"\n")
          PY

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: isolated-benchmark-${{ inputs.rows }}
          path: ${{ runner.temp }}/benchmark-results/benchmark.json
          retention-days: 30
          if-no-files-found: error
